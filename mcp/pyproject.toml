[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plaudeapi-trade-mcp"
version = "0.1.0"
description = "Read-only, public-facts-only MCP server for PlaudeAPI Trade. General information, not legal advice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bandi & Associates PLLC" }]
dependencies = ["mcp>=2.3.0,<3", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
plaudeapi-trade-mcp = "plaudeapi_trade_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plaudeapi_trade_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
